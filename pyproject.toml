[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["env", "node_modules", "staticfiles", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # long strings in lab specs; formatting is handled by `ruff format`

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py"]
