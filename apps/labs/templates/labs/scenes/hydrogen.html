{% load lab_tags %}{# Experiment 1 — hydrogen: flask with Zn + HCl, gas delivery tube, cylinder over water #}
<svg viewBox="0 0 900 470" class="relative z-[1] block h-auto w-full" role="img" :aria-label="exp.title">
  <defs>
    <clipPath id="h-flask-in"><path d="M215,152 V216 L149,377 Q145,388 157,388 H303 Q315,388 311,377 L245,216 V152 Z"/></clipPath>
    <clipPath id="h-cyl-in"><rect x="613" y="104" width="64" height="300" rx="10"/></clipPath>
    <linearGradient id="h-glass" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".55"/></linearGradient>
  </defs>

  {# retort stand for the cylinder (appears with the gas system) #}
  <g x-show="has('cylinder')" class="appear" style="display:none">
    <rect x="700" y="436" width="130" height="10" rx="3" fill="#5c6b78"/>
    <rect x="788" y="70" width="8" height="370" rx="3" fill="#7b8a96"/>
    <path d="M792,190 H690" stroke="#7b8a96" stroke-width="6" stroke-linecap="round"/>
    <rect x="672" y="180" width="22" height="20" rx="4" fill="#5c6b78"/>
  </g>

  {# trough with water #}
  <g x-show="has('trough')" class="appear" style="display:none">
    <path d="M470,302 H812 L800,434 Q799,442 790,442 H492 Q483,442 482,434 Z" fill="#cfe6f2" fill-opacity=".35" stroke="#6b8ba0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M474,330 H808 L800,434 Q799,440 790,440 H492 Q484,440 483,434 Z" fill="#bfe0ef" fill-opacity=".85"/>
    <path d="M474,330 H808" stroke="#8fc3dc" stroke-width="2"/>
  </g>

  {# gas collecting cylinder, upside down, filled with water #}
  <g x-show="has('cylinder')" class="appear" style="display:none">
    <g clip-path="url(#h-cyl-in)">
      <rect x="610" y="100" width="70" height="310" fill="#bfe0ef"/>
      {# gas pocket grows from the closed (top) end #}
      <rect x="610" y="100" width="70" :height="4 + sc.gasHeight()" fill="#f7fbfd"/>
      <g x-show="sc.collecting">
        {% for i in 6|times %}
          <circle :cx="sc.cylBubbles[{{ i }}].x" cy="392" :r="sc.cylBubbles[{{ i }}].r" fill="#ffffff" stroke="#8fc3dc" class="bubble"
                  :style="`--rise:${-(290 - sc.gasHeight())}px; --dur:${sc.cylBubbles[{{ i }}].dur}s; --delay:${sc.cylBubbles[{{ i }}].delay}s`"/>
        {% endfor %}
      </g>
    </g>
    <rect x="613" y="104" width="64" height="300" rx="10" fill="url(#h-glass)" fill-opacity=".35" stroke="#6b8ba0" stroke-width="3"/>
    {# graduation: 0 mL at the top, 250 mL near the mouth #}
    {% for m in "0 50 100 150 200 250"|split %}
      <line x1="613" :y1="sc.markY({{ m }})" x2="628" :y2="sc.markY({{ m }})" stroke="#4a5b74" stroke-width="1.6"/>
      <text x="604" :y="sc.markY({{ m }}) + 4" text-anchor="end" font-size="12" fill="#4a5b74">{{ m }}</text>
    {% endfor %}
  </g>

  {# gas delivery tube with stopper #}
  <g x-show="has('stopper_tube')" class="appear" style="display:none">
    <path d="M230,140 V96 Q230,84 242,84 H533 Q545,84 545,96 V404 Q545,418 559,418 H631 Q645,418 645,404 V386"
          fill="none" stroke="#6b8ba0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M230,140 V96 Q230,84 242,84 H533 Q545,84 545,96 V404 Q545,418 559,418 H631 Q645,418 645,404 V386"
          fill="none" stroke="#eef6fa" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M208,134 H252 L248,166 H212 Z" fill="#7a4a35"/>
    <path d="M212,140 H248" stroke="#94604a" stroke-width="2"/>
  </g>

  {# flask #}
  <g x-show="has('flask')" class="appear" style="display:none">
    <g clip-path="url(#h-flask-in)">
      <rect x="140" :y="388 - sc.acidLevel" width="180" :height="sc.acidLevel" fill="#d8ecf4"/>
      <path :d="`M140,${388 - sc.acidLevel} H320`" stroke="#9ccbe0" stroke-width="2" x-show="sc.acidLevel > 0"/>
      {# zinc granules shrink as zinc is consumed #}
      <g x-show="has('zn')">
        {% for i in 5|times %}
          <ellipse :cx="sc.granules[{{ i }}].x" :cy="388 - sc.granules[{{ i }}].r * sc.znScale()" :rx="sc.granules[{{ i }}].r * 1.2 * sc.znScale()"
                   :ry="sc.granules[{{ i }}].r * sc.znScale()" :fill="sc.granules[{{ i }}].c"/>
        {% endfor %}
      </g>
      <g x-show="sc.reacting">
        {% for i in 12|times %}
          <circle :cx="sc.flaskBubbles[{{ i }}].x" cy="380" :r="sc.flaskBubbles[{{ i }}].r" fill="#ffffff" stroke="#9ccbe0" class="bubble"
                  :style="`--rise:${-(sc.acidLevel - 14)}px; --dur:${sc.flaskBubbles[{{ i }}].dur}s; --delay:${sc.flaskBubbles[{{ i }}].delay}s`"/>
        {% endfor %}
      </g>
    </g>
    <path d="M213,150 V216 L147,377 Q142,392 158,392 H302 Q318,392 313,377 L247,216 V150"
          fill="url(#h-glass)" fill-opacity=".3" stroke="#6b8ba0" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M207,150 H253" stroke="#6b8ba0" stroke-width="3.2" stroke-linecap="round"/>
    <text x="230" y="414" text-anchor="middle" font-size="13" fill="#4a5b74" x-show="has('zn')">Zn<tspan x-show="sc.acidLevel > 0"> + HCl</tspan></text>
  </g>

  {# acid bottle pouring (one-off animation) #}
  <g x-show="sc.pouring" style="display:none">
    <g class="pour">
      <path d="M300,40 h22 v14 l10 10 v52 a6 6 0 0 1 -6 6 h-30 a6 6 0 0 1 -6 -6 v-52 l10 -10 z" fill="#ffffff" stroke="#6b8ba0" stroke-width="2.5"/>
      <text x="311" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2f4b">HCl</text>
    </g>
  </g>

  {# purity test: safe animation of the "pop" #}
  <g x-show="sc.popTest" style="display:none" transform="translate(705 90)">
    <g class="burst">
      <path d="M0,-34 L8,-12 L32,-16 L14,0 L30,18 L6,12 L0,34 L-6,12 L-30,18 L-14,0 L-32,-16 L-8,-12 Z" fill="#fdf1d8" stroke="#d98b06" stroke-width="2"/>
    </g>
    <path class="flame" d="M0,8 C10,-4 6,-14 0,-24 C-6,-14 -10,-4 0,8 Z" fill="#e8a317"/>
  </g>
</svg>

{# live readout #}
<div x-show="sc.started" x-cloak class="relative z-10 m-3 md:absolute md:right-3 md:top-3 md:m-0 rounded-lg bg-paper/95 px-4 py-3 ring-1 ring-enamel-deep">
  <p class="text-xs text-ink-soft">V(H<sub>2</sub>)</p>
  <p class="num text-2xl font-semibold"><span x-text="fmt(sc.V, 0)"></span> <span class="text-base font-normal text-ink-soft" x-text="ui.ml"></span></p>
</div>
