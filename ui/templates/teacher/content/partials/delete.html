{% load i18n %}{# Delete icon button (asks in the shared confirm dialog): what (module|topic|stage|question|item), pk. Refusals come back as messages. #}
<form method="post" action="{% url 'teacher:delete' course.slug what pk %}" class="inline-flex">
  {% csrf_token %}
  <button type="submit" class="btn btn-ghost btn-icon btn-sm text-ink-soft hover:text-danger-600" aria-label="{% translate 'Delete' %}" title="{% translate 'Delete' %}"
          data-confirm="{% translate 'Delete it?' %}" data-confirm-text="{% translate 'Items students have already worked on are retired instead of deleted.' %}" data-confirm-label="{% translate 'Delete' %}" data-confirm-variant="danger">{% include "components/icons.html#trash" %}</button>
</form>
