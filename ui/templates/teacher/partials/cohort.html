{% load i18n %}{# Research group badge: cohort ("" / control / experimental). Info/neutral only — never good/bad colours. #}
{% if cohort == "experimental" %}<span class="badge badge-info font-bold">{% translate "Experimental" %}</span>
{% elif cohort == "control" %}<span class="badge badge-neutral font-bold">{% translate "Control" %}</span>
{% else %}<span class="text-caption font-normal text-ink-faint">{% translate "Not assigned" %}</span>{% endif %}
